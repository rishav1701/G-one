[project]
name = "gone-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.162.0", "starlette==1.10.0", "uvicorn[standard]==0.34.2", "pydantic==2.11.4",
  "pydantic-settings==2.9.1", "SQLAlchemy==2.0.40", "alembic==1.15.2",
  "psycopg[binary]==3.2.9", "argon2-cffi==23.1.0", "python-multipart==0.0.31"
]
[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.28.1", "pytest-cov==6.1.1"]
ml = ["numpy==2.4.6", "pandas==3.1.1", "scikit-learn==1.9.1", "joblib==1.6.0", "PyYAML==6.0.3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
